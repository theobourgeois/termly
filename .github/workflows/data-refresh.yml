name: Data Refresh
on:
  schedule:
    # Every day: timetables (sections, seats, rooms, exams), plus details for new courses.
    - cron: "0 8 * * *"
    # Mondays, an hour later: every course's description and requisites, and RateMyProfessors.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      universities:
        description: "Universities to refresh, comma-separated (default: all)"
        required: false
      full:
        description: "Also refresh every course's details and RateMyProfessors"
        type: boolean
        default: false
      force:
        description: "Save even if the health checks fail (when a big change on the timetable is real)"
        type: boolean
        default: false
# Never two refreshes at once: they'd write the same universities, and triage reads a run that's
# still "running" as one that crashed.
concurrency:
  group: data-refresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # One job per scraper in src/scripts/node/universities, so adding a university needs no change here.
  list:
    runs-on: ubuntu-latest
    outputs:
      universities: ${{ steps.list.outputs.universities }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          WANTED: ${{ inputs.universities }}
        run: |
          all=$(ls src/scripts/node/universities/*.js | xargs -n1 basename | sed 's/\.js$//')
          if [ -n "$WANTED" ]; then all=$(echo "$WANTED" | tr ',' '\n' | tr -d ' '); fi
          echo "universities=$(echo "$all" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Each university is its own server and its own job: they run side by side, and one failing
      # leaves the others (and its own last good data) alone.
      fail-fast: false
      # More than a few imports at once time out in Supabase (statement timeout), as ten did on 2026-10-17.
      max-parallel: 4
      matrix:
        university: ${{ fromJSON(needs.list.outputs.universities) }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FULL: ${{ github.event.schedule == '0 9 * * 1' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --prefix src/scripts/node
          pip install -r src/scripts/py/requirements.txt
      # Timetable first: the RateMyProfessors import matches reviews against the stored courses.
      - name: Refresh the timetable and course details
        run: node src/scripts/node/refresh.js ${{ matrix.university }} --details ${{ env.FULL == 'true' && 'all' || 'missing' }} ${{ inputs.force && '--force' || '' }}
      - name: Import RateMyProfessors professors and reviews
        if: ${{ env.FULL == 'true' }}
        run: python3 src/scripts/py/rmp_reviews.py --university ${{ matrix.university }}

  # Opens an issue and sends an agent (scraper-fix.yml) for each university that failed twice in a
  # row, and closes the issue once it's healthy again. See src/scripts/node/triage.js.
  triage:
    needs: refresh
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check every university's last two refreshes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/scripts/node/triage.js

  # Each university's catalog as one file, once the refreshes are done so these reads don't compete
  # with them. See src/scripts/node/publish-catalogs.js.
  publish:
    needs: refresh
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish the catalog files
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node src/scripts/node/publish-catalogs.js

  # A new deployment picks up the catalog files, and starts with no cached pages. Without the
  # VERCEL_DEPLOY_HOOK secret, pages are refreshed in place and still read Supabase. Without
  # REVALIDATE_SECRET and SITE_URL either, they refresh within a day.
  revalidate:
    needs: [refresh, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the site
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
            exit 0
          fi
          if [ -z "$REVALIDATE_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "REVALIDATE_SECRET or SITE_URL isn't set; pages refresh within a day"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SITE_URL/api/revalidate" -H "Authorization: Bearer $REVALIDATE_SECRET"
